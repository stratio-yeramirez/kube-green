# Valores del entorno DEV de Banco Pichincha (eks-dya-bda-stratio-dev, namespace keos-core).
#
# Recogen la configuración que ese cluster ya tiene desplegada. El chart trae por defecto
# los colores de DEV, pero no el CLUSTER_NAME, que sí está puesto en el cluster.
#
# Uso:
#   helm upgrade kube-green ./kube-green-<version>.tgz \
#     -n keos-core -f values-dev.yaml
manager:
  env:
    name: "dev"
    color: "#1e3c72"
    label: "Desarrollo"
    clusterName: "eks-dya-bda-stratio-dev"

  # El deployment de DEV lleva este margen desde antes de gestionarse con Helm. Son los
  # segundos que pueden pasar entre la hora programada y el procesamiento antes de que el
  # operador se salte la ejecución; el valor por defecto del binario es 60. TEST no lo tiene.
  extraArgs:
    - --sleep-delta=300

frontend:
  # DEV tiene una sola réplica; el chart trae 2 por defecto.
  replicas: 1
